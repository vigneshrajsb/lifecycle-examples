environment:
  autoDeploy: true
  ignoreFiles:
    - remote-env-ignore/**
  defaultServices:
    - name: frontend
    - name: backend
    - name: jenkins
  optionalServices:
    - name: cache
services:
  - name: frontend
    defaultUUID: dev-0
    github:
      repository: vigneshrajsb/lifecycle-examples
      branchName: codex/lfc-remote-config-fixture
      docker:
        builder:
          engine: buildkit
        defaultTag: main
        app:
          dockerfilePath: Dockerfile.frontend
          ports:
            - 3000
          env:
            COMPONENT: app
            ENV: lifecycle
            API_URL: https://{{{backend_publicUrl}}}
            CACHE_URL: '{{{cache_internalHostname}}}'
            WES_IS: GOAT
      deployment:
        public: true
        readiness:
          tcpSocketPort: 3000
        hostnames:
          defaultInternalHostname: frontend-dev-0
  - name: backend
    requires:
      - name: db
    defaultUUID: dev-0
    docker:
      dockerImage: lifecycleoss/example-backend
      defaultTag: 0.1.0
      ports:
        - 8080
      env:
        COMPONENT: server
        ENV: lifecycle
        DATABASE_URL: '{{{db_internalHostname}}}'
        DATABASE_PORT: '5432'
      deployment:
        public: true
        readiness:
          tcpSocketPort: 8080
  - name: db
    defaultUUID: dev-0
    docker:
      dockerImage: lifecycleoss/example-db
      defaultTag: 0.1.0
      ports:
        - 5432
      env:
        COMPONENT: db
        ENV: lifecycle
        POSTGRES_DB: tasks
        POSTGRES_USER: lifecycle
        POSTGRES_PASSWORD: mysecretpassword
      deployment:
        public: false
        readiness:
          tcpSocketPort: 5432
  - name: cache
    defaultUUID: dev-0
    docker:
      dockerImage: redis
      defaultTag: 8.0.2
      ports:
        - 6379
      env:
        COMPONENT: cache
        ENV: lifecycle
      deployment:
        public: false
        readiness:
          tcpSocketPort: 6379
  - name: remote-fixture-a
    ignoreFiles:
      - remote-fixture-a-ignore/**
      - remote-fixture-shared-ignore/**
      - remote-compare-ignore/**
    defaultUUID: dev-0
    github:
      repository: vigneshrajsb/lifecycle-examples
      branchName: codex/lfc-remote-config-fixture
      docker:
        builder:
          engine: buildkit
        defaultTag: main
        app:
          dockerfilePath: Dockerfile.remote-fixture
          ports:
            - 8080
      deployment:
        public: false
        readiness:
          tcpSocketPort: 8080
  - name: remote-fixture-b
    ignoreFiles:
      - remote-fixture-b-ignore/**
      - remote-fixture-shared-ignore/**
      - remote-compare-ignore/**
    defaultUUID: dev-0
    github:
      repository: vigneshrajsb/lifecycle-examples
      branchName: codex/lfc-remote-config-fixture
      docker:
        builder:
          engine: buildkit
        defaultTag: main
        app:
          dockerfilePath: Dockerfile.remote-fixture
          ports:
            - 8080
      deployment:
        public: false
        readiness:
          tcpSocketPort: 8080
  - name: jenkins
    helm:
      repository: vmelikyan/lc-test
      branchName: main
      envLens: true
      chart:
        name: jenkins
        repoUrl: https://charts.bitnami.com/bitnami
        version: 13.6.8
        values:
          - service.type=ClusterIP
          - ingress.enabled=true
          - ingress.hostname={{jenkins_publicUrl}}
          - ingress.ingressClassName=nginx
