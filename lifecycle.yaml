environment:
  autoDeploy: true
  defaultServices:
    - name: worker
  optionalServices:
    - name: cache
services:
  - name: worker
    requires:
      - name: db
    defaultUUID: dev-0
    docker:
      dockerImage: lifecycleoss/example-backend
      defaultTag: 0.1.0
      ports:
        - 8080
      env:
        COMPONENT: worker
        ENV: lifecycle
        DATABASE_URL: '{{{db_internalHostname}}}'
        DATABASE_PORT: '5432'
      deployment:
        public: true
        readiness:
          tcpSocketPort: 8080
  - name: db
    defaultUUID: dev-0
    docker:
      dockerImage: lifecycleoss/example-db
      defaultTag: 0.1.0
      ports:
        - 5432
      env:
        COMPONENT: db
        ENV: lifecycle
        POSTGRES_DB: tasks
        POSTGRES_USER: lifecycle
        POSTGRES_PASSWORD: mysecretpassword
      deployment:
        public: false
        readiness:
          tcpSocketPort: 5432
  - name: cache
    defaultUUID: dev-0
    docker:
      dockerImage: redis
      defaultTag: 8.0.2
      ports:
        - 6379
      env:
        COMPONENT: cache
        ENV: lifecycle
      deployment:
        public: false
        readiness:
          tcpSocketPort: 6379
